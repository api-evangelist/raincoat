aid: raincoat
name: Raincoat
description: >-
  Raincoat builds embedded, highly scalable parametric climate insurance
  products and the automated infrastructure that powers them. Founded in 2019
  and headquartered in San Juan, Puerto Rico, the company combines real-time
  environmental and geospatial data with parametric risk models to automatically
  trigger coverage and deliver instant, direct payouts to beneficiaries after
  natural disasters such as hurricanes, earthquakes, floods and excess rainfall.
  Raincoat operates as B2B2C infrastructure, connecting insurers, reinsurers and
  distribution partners so they can offer embedded disaster protection across
  Latin America, the Caribbean, the United States and other climate-exposed
  markets. The company is backed by Anthemis and Two Sigma Ventures. Raincoat
  publishes no public developer API, developer portal, or API documentation at
  this time; integration is handled directly through partnership.
